<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobRadar Autofill</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .btn-autofill {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn-autofill:hover {
      background: #0369a1;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #10b981;
      min-height: 16px;
    }
    .info {
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>⚡ JobRadar Autofill</h2>
  <div class="row">
    <div class="field" style="flex: 1;">
      <label>First Name</label>
      <input type="text" id="firstName" placeholder="First Name">
    </div>
    <div class="field" style="flex: 1;">
      <label>Last Name</label>
      <input type="text" id="lastName" placeholder="Last Name">
    </div>
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Phone</label>
    <input type="tel" id="phone" placeholder="+91 9876543210">
  </div>
  <div class="field">
    <label>LinkedIn URL</label>
    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/username">
  </div>
  <div class="field">
    <label>GitHub URL</label>
    <input type="url" id="github" placeholder="https://github.com/username">
  </div>
  <div class="field">
    <label>Portfolio / Website</label>
    <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
  </div>

  <button class="btn-autofill" id="autofillBtn">⚡ 1-Click Autofill Form</button>
  <div class="status" id="status"></div>
  <div class="info">Profile is stored 100% locally on your machine.</div>

  <script src="popup.js"></script>
</body>
</html>
