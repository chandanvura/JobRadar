<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found · JobRadar</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root {
    --bg: #090d16;
    --card: #111827;
    --border: #1f2937;
    --text: #f3f4f6;
    --subtext: #9ca3af;
    --primary: #0d9488;
    --primary-hover: #14b8a6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --subtext: #64748b;
      --primary: #0f766e;
      --primary-hover: #0d9488;
    }
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
    box-sizing: border-box;
  }
  .card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 2.5rem;
    max-width: 28rem;
    text-align: center;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }
  .badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--primary);
    background-color: rgba(13, 148, 136, 0.1);
    border-radius: 9999px;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 800;
    margin: 0 0 0.75rem 0;
    letter-spacing: -0.025em;
  }
  p {
    color: var(--subtext);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 1.5rem 0;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: var(--primary);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.625rem 1.25rem;
    border-radius: 0.5rem;
    transition: background-color 0.15s ease-in-out;
  }
  a.btn:hover {
    background-color: var(--primary-hover);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">404 Error</span>
    <h1>Page Not Found</h1>
    <p>The job listing, filter view, or page you are looking for does not exist or has been archived.</p>
    <a href="/" class="btn">Return to JobRadar</a>
  </div>
</body>
</html>
