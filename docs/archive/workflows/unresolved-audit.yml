name: Unresolved feeds bounded audit
on:
  push:
    branches: [ats-audit/2026-10-08]
    paths: [companies/unresolved-audit-2026-10-08-*.json, scripts/unresolved_audit.py, .github/workflows/unresolved-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ['01', '02', '03', '04']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.unresolved_audit --manifest companies/unresolved-audit-2026-10-08-${{ matrix.batch }}.json --output artifacts/unresolved-audit-${{ matrix.batch }}.json
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unresolved-audit-${{ matrix.batch }}
          path: artifacts/unresolved-audit-*.json
          retention-days: 7
