name: Failing feed timing evidence
on:
  push:
    branches: [feed-timing/2026-10-08]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m scripts.feed_timing_probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failing-feed-timing
          path: artifacts/feed-timing
          retention-days: 7
