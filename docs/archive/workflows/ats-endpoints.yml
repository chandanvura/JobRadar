name: ATS Detective evidence-derived endpoint probes
on:
  push:
    branches: [ats-detective/2026-10-07]
    paths: [scripts/ats_endpoint_probe.py, .github/workflows/ats-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.ats_endpoint_probe
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '2'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-endpoints-2026-10-07
          path: artifacts/ats-endpoints-2026-10-07
          retention-days: 7
