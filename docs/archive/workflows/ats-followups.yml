name: ATS Detective pagination follow-ups
on:
  push:
    branches: [ats-detective/2026-10-07]
    paths: [scripts/ats_followups.py, .github/workflows/ats-followups.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.ats_followups
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-followups-2026-10-07
          path: artifacts/ats-followups-2026-10-07
          retention-days: 7
