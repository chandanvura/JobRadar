name: Propose patched Sharp override

on:
  pull_request:
    paths:
      - ".github/workflows/sharp-patch-proposal.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/node-dev-audit-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/node-dev-audit-evidence
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test patched sharp transitive override
        working-directory: web
        run: |
          npm pkg set 'overrides.sharp=0.35.5'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          node -e "if(require('sharp/package.json').version!=='0.35.5') process.exit(1)"
      - name: Verify full runtime-compatible checks
        working-directory: web
        run: |
          npm test
          npm run test:api
          npm run lint
          npm run typecheck:ui
          npm audit --omit=dev --audit-level=high
      - name: Record only compatible package and lockfile changes
        run: |
          if git diff --quiet -- web/package.json web/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git commit -m "fix(devtools): override vulnerable transitive sharp with patched version"
          git push origin HEAD:fix/node-dev-audit-evidence
