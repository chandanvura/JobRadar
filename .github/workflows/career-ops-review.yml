name: Career Ops employer evidence review
on:
  push:
    branches: [career-ops/2026-10-07]
    paths: [companies/career-ops-review-2026-10-07.json, scripts/ats_deep.py, scripts/career_ops_probe.py, .github/workflows/career-ops-review.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.coverage_snapshot --output artifacts/career-ops-before.json
      - run: python -m scripts.ats_deep --manifest companies/career-ops-review-2026-10-07.json --output artifacts/career-ops-review
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '2'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: career-ops-employer-evidence
          path: artifacts/
          retention-days: 7
