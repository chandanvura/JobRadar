name: Deploy independent JobRadar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-cloudflare.yml"

concurrency:
  group: jobradar-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JOBRADAR_INGEST_SECRET: ${{ secrets.JOBRADAR_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate deployment secrets and resolve account
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$JOBRADAR_INGEST_SECRET"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            account_id="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts \
              | jq -r 'if .success and (.result | length) == 1 then .result[0].id else empty end')"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
      - run: npm install --no-audit --no-fund
      - name: Ensure a workers.dev hostname exists
        run: |
          current_subdomain="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')"
          if [ -z "$current_subdomain" ]; then
            for candidate in chandanvura chandanvura-jobradar jobradar-chandanvura; do
              response="$(curl --silent --show-error \
                -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"subdomain\":\"$candidate\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
              if [ "$(printf '%s' "$response" | jq -r '.success')" = "true" ]; then
                current_subdomain="$candidate"
                break
              fi
            done
          fi
          test -n "$current_subdomain"
          echo "Workers hostname: jobradar.$current_subdomain.workers.dev"
      - name: Create or resolve production database
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "jobradar-db") | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create jobradar-db --location apac
            database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "jobradar-db") | .uuid' | head -n 1)"
          fi
          test -n "$database_id"
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Apply versioned database migrations
        run: |
          node scripts/prepare-cloudflare.mjs
          npx wrangler d1 migrations apply jobradar-db --remote --config wrangler.migrations.json
      - name: Build and deploy production Worker
        run: |
          npm run build
          node scripts/prepare-cloudflare.mjs --patch-build
          deploy_output="$(npx wrangler deploy --config dist/server/wrangler.json)"
          printf '%s\n' "$deploy_output"
          worker_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1 || true)"
          test -n "$worker_url"
          echo "JOBRADAR_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
      - name: Configure protected ingestion
        run: printf '%s' "$JOBRADAR_INGEST_SECRET" | npx wrangler secret put JOBRADAR_INGEST_SECRET --config dist/server/wrangler.json
      - name: Verify deployed Worker
        run: |
          npx wrangler deployments status --config dist/server/wrangler.json
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$JOBRADAR_WORKER_URL/" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$JOBRADAR_WORKER_URL/api/dashboard" | jq -e '.configured == true and (.jobs | type == "array") and (.companies | type == "array")' > /dev/null
          echo "Independent JobRadar verified at $JOBRADAR_WORKER_URL"
