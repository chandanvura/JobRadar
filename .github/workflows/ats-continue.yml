name: Continue official employer feed verification
on:
  push:
    branches: [ats-continue/2026-10-08]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m bandit -q -r scraper scripts
      - run: python -m scripts.coverage_snapshot --output artifacts/continue-before.json
      - run: python -m scripts.ats_deep --manifest companies/ats-continue-2026-10-08.json --output artifacts/continue-evidence
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '1'
      - run: python -m scripts.continue_evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-continue-evidence
          path: artifacts/
          retention-days: 7
