name: JobRadar hourly scan
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scrape.yml"
      - "companies/**"
      - "scraper/**"
      - "requirements.txt"
      - "tests/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
concurrency:
  group: jobradar-hourly
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify source revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          python - <<'PY'
          import csv
          from pathlib import Path
          from scraper.normalization import MAX_EXPERIENCE_YEARS, MAX_JOB_AGE_HOURS
          companies=list(csv.DictReader(Path("companies/companies.csv").open(encoding="utf-8")))
          enabled=[row for row in companies if row.get("enabled","true").lower()=="true"]
          print(f"Company registry: {len(companies)} total, {len(enabled)} enabled")
          print(f"Policy: posted within {MAX_JOB_AGE_HOURS} hours; explicit 0-{MAX_EXPERIENCE_YEARS} YOE")
          if len(enabled)<150: raise SystemExit(f"Registry unexpectedly shrank: {len(enabled)} enabled companies")
          keys=[(row["ats_provider"].lower(),row["ats_identifier"].lower()) for row in enabled]
          if len(keys)!=len(set(keys)): raise SystemExit("Duplicate ATS identifiers found in company registry")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run matching and notifier tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
      - run: python -m scraper.main
        env:
          JOBRADAR_API_URL: ${{ secrets.JOBRADAR_API_URL }}
          JOBRADAR_INGEST_SECRET: ${{ secrets.JOBRADAR_INGEST_SECRET }}
          JOBRADAR_SITE_BYPASS_TOKEN: ${{ secrets.JOBRADAR_SITE_BYPASS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
