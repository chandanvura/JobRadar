name: JobRadar free-tier scan
on:
  schedule:
    # Six full scans per day keep D1 writes comfortably inside the free tier.
    # Manual runs remain available for urgent refreshes; code pushes never
    # start an expensive full scan automatically.
    - cron: "7 */4 * * *"
  workflow_dispatch:
concurrency:
  # Queue overlapping push/manual/scheduled runs instead of cancelling an active scan.
  group: jobradar-free-tier-scan
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Run manual requests; gate scheduled scans by freshness
        id: freshness
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python -m scraper.scan_gate
  validate:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Report trigger timing
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Trigger event: ${TRIGGER_EVENT}"
          echo "Configured cron: ${CRON_SCHEDULE:-not-a-scheduled-run}"
          echo "Runner started UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Verify source revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          python - <<'PY'
          import csv
          from pathlib import Path
          from scraper.normalization import MAX_EXPERIENCE_YEARS, MAX_JOB_AGE_HOURS
          companies=list(csv.DictReader(Path("companies/companies.csv").open(encoding="utf-8")))
          enabled=[row for row in companies if row.get("enabled","true").lower()=="true"]
          print(f"Company registry: {len(companies)} total, {len(enabled)} enabled")
          print(f"Policy: posted within {MAX_JOB_AGE_HOURS} hours; explicit 0-{MAX_EXPERIENCE_YEARS} YOE")
          if len(enabled)<500: raise SystemExit(f"Registry unexpectedly shrank: {len(enabled)} enabled companies")
          keys=[(row["ats_provider"].lower(),row["ats_identifier"].lower()) for row in enabled]
          if len(keys)!=len(set(keys)): raise SystemExit("Duplicate ATS identifiers found in company registry")
          names=[row["company_name"].strip().casefold() for row in enabled]
          if len(names)!=len(set(names)): raise SystemExit("Duplicate company names found in company registry")
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run matching, distribution, and notifier tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
  discover:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Set daily cache key
        id: cache-date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore shard-local immutable job-detail cache
        uses: actions/cache@v6
        with:
          path: .cache/jobradar-http
          key: jobradar-details-${{ runner.os }}-${{ steps.cache-date.outputs.value }}-shard-${{ matrix.shard }}
      - name: Discover shard ${{ matrix.shard }}
        run: |
          for attempt in 1 2; do
            if python -m scraper.distributed worker --index "${{ matrix.shard }}" --count 8 --output "artifacts/shard-${{ matrix.shard }}.json"; then
              exit 0
            fi
            echo "Shard ${{ matrix.shard }} attempt $attempt failed"
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 15
          done
        env:
          JOBRADAR_SOURCE_CONCURRENCY: 5
          JOBRADAR_CUSTOM_CONCURRENCY: 2
          JOBRADAR_DOMAIN_CONCURRENCY: 1
          JOBRADAR_WORKDAY_LISTING_CONCURRENCY: 1
          JOBRADAR_WORKDAY_DETAIL_CONCURRENCY: 1
          JOBRADAR_CUSTOM_TIMEOUT: 12
      - name: Upload immutable shard result
        uses: actions/upload-artifact@v7
        with:
          name: jobradar-shard-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2
  finalize:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download all shard results
        uses: actions/download-artifact@v8
        with:
          pattern: jobradar-shard-*
          path: artifacts
          merge-multiple: true
      - name: Validate, deduplicate, ingest, and notify
        run: python -m scraper.distributed finalize artifacts/shard-*.json
        env:
          JOBRADAR_API_URL: https://jobradar.chandanvura.workers.dev
          JOBRADAR_INGEST_SECRET: ${{ secrets.JOBRADAR_INGEST_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
