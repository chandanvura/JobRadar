name: JobRadar hourly scan
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: jobradar-hourly
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scraper.main
        env:
          JOBRADAR_API_URL: ${{ secrets.JOBRADAR_API_URL }}
          JOBRADAR_INGEST_SECRET: ${{ secrets.JOBRADAR_INGEST_SECRET }}
          JOBRADAR_SITE_BYPASS_TOKEN: ${{ secrets.JOBRADAR_SITE_BYPASS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
