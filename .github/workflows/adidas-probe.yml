name: Verify official adidas XML against live pagination
on:
  push:
    branches: [ats-detective/adidas]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify-harness.sh python
      - run: python -m scripts.probe_adidas
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adidas-probe
          path: artifacts/adidas-probe.json
          if-no-files-found: warn
          retention-days: 7
