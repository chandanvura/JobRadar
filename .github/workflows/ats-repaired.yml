name: ATS Detective complete repaired feeds
on:
  push:
    branches: [ats-detective/2026-10-07]
    paths: [scripts/ats_repaired.py, scraper/**, tests/test_jibe.py, companies/companies.csv, .github/workflows/ats-repaired.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify-harness.sh python
      - run: python -m scripts.ats_repaired
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '2'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-repaired-2026-10-07
          path: artifacts/ats-repaired-2026-10-07
          retention-days: 7

# Full harness scans all scripts, including read-only discovery probes.
