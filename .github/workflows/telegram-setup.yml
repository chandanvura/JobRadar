name: Telegram destination setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-private-chat-id:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Message the chat ID privately to users who sent /start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m scraper.telegram_setup
