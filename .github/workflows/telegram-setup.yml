name: Telegram destination setup

on:
  push:
    branches: [main]
    paths: [".github/workflows/telegram-setup.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-private-chat-id:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Message the chat ID privately to users who sent /start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from scraper.telegram_setup import telegram_call
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          bot=telegram_call(f"https://api.telegram.org/bot{token}","getMe")["result"]
          print(f"Send /start privately to @{bot['username']} to activate JobRadar notifications.")
          PY
          python -m scraper.telegram_setup
