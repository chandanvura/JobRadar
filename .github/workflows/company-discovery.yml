name: Review new company sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths: ['scripts/discover_companies.py', 'config/discovery-pilot.json', '.github/workflows/company-discovery.yml']
permissions:
  contents: read
concurrency:
  group: jobradar-company-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Find candidates without changing production data
        run: python -m scripts.discover_companies
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: company-discovery-review
          path: artifacts/company-discovery
          retention-days: 14
