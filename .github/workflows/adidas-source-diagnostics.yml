name: Adidas official endpoint diagnostics

on:
  pull_request:
    paths:
      - "scripts/diagnose_adidas_source.py"
      - ".github/workflows/adidas-source-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install HTTPX
        run: python -m pip install "httpx==0.28.1" "beautifulsoup4==4.13.5"
      - name: Probe official Adidas endpoints (bounded and read-only)
        run: python scripts/diagnose_adidas_source.py
