name: ATS Detective batch 01
on:
  push:
    branches: [ats-detective/batch-01]
    paths: [scripts/ats_detective.py, companies/ats-detective-batch-01.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobradar-ats-detective
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/verify-harness.sh python
      - name: Investigate at most 50 employers using public HTTP only
        run: python -m scripts.ats_detective --manifest companies/ats-detective-batch-01.json
        env:
          JOBRADAR_DOMAIN_CONCURRENCY: '1'
          JOBRADAR_WORKDAY_LISTING_CONCURRENCY: '1'
          JOBRADAR_WORKDAY_DETAIL_CONCURRENCY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-detective-01
          path: artifacts/ats-detective-01
          retention-days: 7
          if-no-files-found: warn
