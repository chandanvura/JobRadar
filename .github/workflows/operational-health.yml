name: JobRadar operational health

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: jobradar-operational-health
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  record-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check operational evidence without modifying main
        run: python -m scraper.ops_check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operational-health-${{ github.run_id }}
          path: ops-report.json
          if-no-files-found: error
          retention-days: 7
