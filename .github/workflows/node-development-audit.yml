name: Node development dependency audit

on:
  pull_request:
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/node-development-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify locked dependency installation
        run: npm ci --no-audit --no-fund
      - name: Full development tooling audit (advisory evidence)
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/jobradar-node-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/jobradar-node-audit.json" <<'NODE'
          const fs=require("fs");
          const audit=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const vulnerabilities=audit.vulnerabilities || {};
          console.log("Audit totals",JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name,item] of Object.entries(vulnerabilities)) {
            console.log(JSON.stringify({name,severity:item.severity,via:item.via,effects:item.effects,range:item.range,nodes:item.nodes,fixAvailable:item.fixAvailable}));
          }
          NODE
          echo "npm audit exit status: $audit_status"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
