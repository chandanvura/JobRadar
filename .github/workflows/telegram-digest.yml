name: JobRadar Telegram daily update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-digest.yml"
  schedule:
    # 08:00 Asia/Kolkata; GitHub scheduled runs can be delayed.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify saved private recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from scraper.telegram_setup import telegram_call
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id=os.environ["TELEGRAM_CHAT_ID"]
          base=f"https://api.telegram.org/bot{token}"
          bot=telegram_call(base,"getMe")["result"]
          chat=telegram_call(base,"getChat",{"chat_id":chat_id})["result"]
          if str(chat["id"]) != chat_id or str(chat["id"]) == str(bot["id"]) or chat["type"] != "private":
              raise RuntimeError("TELEGRAM_CHAT_ID must be the numeric private user chat ID sent by the bot")
          print("Saved Telegram chat ID is a valid private recipient.")
          PY
      - name: Send private status update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scraper.telegram_digest

# Verify private delivery after chat activation.
